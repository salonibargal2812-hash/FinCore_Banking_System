<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Logs</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div class="logo">FINCORE <span>BANKING</span></div><a href="/dashboard">Dashboard</a></header><main><div class="topbar"><div><h1>Security & Audit Logs</h1><p class="muted">Track important banking actions.</p></div></div><div class="table-card"><table><thead><tr><th>ID</th><th>User</th><th>Action</th><th>Details</th><th>Time</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${l.id}"></td><td th:text="${l.username}"></td><td><span class="type-pill" th:text="${l.action}"></span></td><td th:text="${l.details}"></td><td th:text="${l.createdAt}"></td></tr></tbody></table></div></main></body></html>
