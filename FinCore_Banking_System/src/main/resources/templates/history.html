<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaction History</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div class="logo">FINCORE <span>BANKING</span></div><a href="/dashboard">Dashboard</a></header><main><div class="topbar"><div><h1>Transaction History</h1><p class="muted" th:text="${account.accountNumber + ' • ' + account.customer.fullName}"></p></div><a class="button" href="/banking/transfer">Transfer Money</a></div><div class="table-card"><table><thead><tr><th>ID</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Performed By</th><th>Date</th></tr></thead><tbody><tr th:each="t:${transactions}"><td th:text="${t.id}"></td><td><span class="type-pill" th:text="${t.type}"></span></td><td th:text="|₹ ${t.amount}|"></td><td th:text="|₹ ${t.balanceAfter}|"></td><td th:text="${t.performedBy}"></td><td th:text="${t.transactionTime}"></td></tr></tbody></table></div></main></body></html>
