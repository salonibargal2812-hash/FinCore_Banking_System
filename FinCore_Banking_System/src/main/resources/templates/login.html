<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bank Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="login-page"><div class="login-card"><div class="logo">FINCORE <span>BANKING</span></div><h1>Secure Login</h1><p class="muted">Role-based banking management portal</p><div th:if="${param.error}" class="alert danger">Invalid username or password.</div><div th:if="${param.logout}" class="alert success">You have been logged out.</div><form method="post" th:action="@{/login}"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="primary full">Sign In</button></form><div class="demo"><b>Demo accounts</b><br>Admin: admin / Admin@123<br>Teller: teller / Teller@123<br>Customer: customer / Customer@123</div></div></body></html>
