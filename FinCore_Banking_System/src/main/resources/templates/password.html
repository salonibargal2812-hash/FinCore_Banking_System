<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="form-page"><div class="form-card"><div class="logo">FINCORE <span>BANKING</span></div><h1>Change Password</h1><p class="muted">Update your account password securely.</p>
<form method="post" th:action="@{/banking/password}"><label>Current Password</label><input name="currentPassword" type="password" required><label>New Password</label><input name="newPassword" type="password" minlength="6" required><button class="primary">Update Password</button><a class="button" href="/dashboard">Back</a></form></div></main></body></html>
