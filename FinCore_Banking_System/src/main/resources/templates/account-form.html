<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Account</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="form-page"><div class="form-card wide"><div class="logo">FINCORE <span>BANKING</span></div><h1>Create Bank Account</h1><p class="muted">Attach the account to an existing customer.</p><form method="post" th:action="@{/banking/accounts}"><label>Customer</label><select name="customerId" required><option value="">Select customer</option><option th:each="c:${customers}" th:value="${c.id}" th:text="${c.fullName + ' • ' + c.email}"></option></select><label>Account Number</label><input name="accountNumber" required><label>Account Type</label><select name="accountType"><option>Savings</option><option>Current</option></select><label>Opening Balance</label><input name="openingBalance" type="number" min="0" step="0.01" required><div class="form-actions"><button class="primary">Create Account</button><a class="button" href="/dashboard">Cancel</a></div></form></div></main></body></html>
